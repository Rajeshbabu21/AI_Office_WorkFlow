version: "3.9"

services:
  backend:
    build: ./backend
    container_name: aiworkflow-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    container_name: aiworkflow-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
